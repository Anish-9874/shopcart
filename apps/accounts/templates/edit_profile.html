{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
* { box-sizing: border-box; }

.profile-container {
    max-width: 560px;
    margin: 40px auto;
    padding: 0 20px;
}

.profile-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    box-shadow: 0 15px 35px rgba(15, 23, 42, .06);
    padding: 36px;
    text-align: center;
}

.profile-card h2 {
    color: #0b0c10;
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 24px;
}

.profile-image {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #eff6ff;
    box-shadow: 0 4px 14px rgba(37, 99, 235, .15);
    margin-bottom: 26px;
}

.form-group {
    text-align: left;
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .3px;
    text-transform: uppercase;
    color: #64748b;
    margin-bottom: 8px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: #0b0c10;
    background: #f8fafc;
    outline: none;
    transition: .2s ease;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #3b82f6;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
}

.form-group input[readonly] {
    background: #f1f5f9;
    color: #94a3b8;
    cursor: not-allowed;
}

.form-group textarea {
    resize: vertical;
    min-height: 90px;
}

.form-group input[type="file"] {
    padding: 9px 10px;
    background: #f8fafc;
    cursor: pointer;
}

.save-btn {
    width: 100%;
    margin-top: 6px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    background: linear-gradient(135deg, #0b0c10, #2563eb);
    transition: .2s ease;
}

.save-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 20px rgba(37, 99, 235, .28);
}

/* RESPONSIVE */
@media (max-width: 480px) {
    .profile-container { margin: 24px auto; padding: 0 14px; }
    .profile-card { padding: 26px 20px; border-radius: 12px; }
    .profile-card h2 { font-size: 20px; margin-bottom: 18px; }
    .profile-image { width: 90px; height: 90px; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
}
</style>

<div class="profile-container">

    <div class="profile-card">

        <h2>Edit Profile</h2>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {% if profile.profile_image %}
                <img src="{{ profile.profile_image.url }}" class="profile-image" alt="{{ request.user.username }}">
            {% else %}
                <img src="{% static 'images/default-profile.png' %}" class="profile-image" alt="{{ request.user.username }}">
            {% endif %}

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    value="{{ request.user.username }}"
                    readonly>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    value="{{ request.user.email }}">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input
                    type="text"
                    name="phone"
                    value="{{ profile.phone }}">
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea
                    name="address"
                    rows="4">{{ profile.address }}</textarea>
            </div>

            <div class="form-group">
                <label>Profile Image</label>
                <input
                    type="file"
                    name="profile_image">
            </div>

            <button type="submit" class="save-btn">
                Save Changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
