{% extends 'admin_base.html' %}

{% block title %}Add Product{% endblock %}

{% block extra_css %}

<style>

/* ---- Palette (CSS variables so the whole form theme lives in one place) ---- */
.form-container {
    --accent: #1D4ED8;
    --accent-dark: #0B0C10;
    --accent-soft: #EFF4FF;
    --accent-ring: rgba(29, 78, 216, .18);
    --highlight: #3B82F6;
    --ink: #0B0C10;
    --muted: #64748B;
    --border: #E2E8F0;
    --danger: #DC2626;
}

.form-container {
    max-width: 700px;
    margin: 20px auto;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(91, 33, 182, .12);
}

.form-header {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    padding: 26px 34px;
    color: #fff;
}

.form-header span {
    display: block;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .75);
    margin-bottom: 6px;
}

.form-header h2 {
    font-size: 22px;
    font-weight: 800;
}

form {
    padding: 30px 34px 34px;
}

form p {
    margin-bottom: 18px;
}

form label {
    display: block;
    margin-bottom: 8px;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
}

form input,
form textarea,
form select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: var(--accent-soft);
    outline: none;
    transition: .2s ease;
}

form textarea {
    resize: vertical;
    min-height: 110px;
}

form input[type="file"] {
    padding: 9px 10px;
    background: var(--accent-soft);
    cursor: pointer;
}

form input:focus,
form textarea:focus,
form select:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 4px var(--accent-ring);
}

/* Django form errors */
form .errorlist {
    list-style: none;
    margin: 6px 0 0;
    padding: 0;
}

form .errorlist li {
    color: var(--danger);
    font-size: 12.5px;
    font-weight: 700;
}

form p:has(.errorlist) input,
form p:has(.errorlist) textarea,
form p:has(.errorlist) select {
    border-color: var(--danger);
}

.submit-btn {
    width: 100%;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .3px;
    cursor: pointer;
    transition: .2s ease;
}

.submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 22px var(--accent-ring);
}

/* RESPONSIVE */
@media (max-width: 600px) {
    .form-container { margin: 12px auto; border-radius: 12px; }
    .form-header { padding: 20px 22px; }
    .form-header h2 { font-size: 19px; }
    form { padding: 22px; }
    form input, form textarea, form select { padding: 11px 12px; font-size: 14px; }
    .submit-btn { padding: 14px; font-size: 14.5px; }
}

</style>

{% endblock %}

{% block content %}

<div class="page-header">
    <h1>📦 Add Product</h1>
</div>

<div class="form-container">

    <div class="form-header">
        <span>Inventory</span>
        <h2>Add New Product</h2>
    </div>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="submit-btn">Add Product</button>

    </form>

</div>

{% endblock %}
