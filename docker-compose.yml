services:
  web:
    build:
      context: .
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: shopcart.settings.prod
      PDB_HOST: ${DOCKER_PDB_HOST:-host.docker.internal}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: ""
      DOCKER_MEDIA_SERVE: "True"
      MEDIA_ROOT: /app/media
      PORT: "8000"
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build:
      context: .
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: shopcart.settings.prod
      PDB_HOST: ${DOCKER_PDB_HOST:-host.docker.internal}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: ""
      MEDIA_ROOT: /app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A shopcart worker --loglevel=info
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  media_data:
  redis_data:
