services:
  web:
    build:
      context: .
    container_name: shopcart_web
    command: uvicorn shopcart.asgi:application --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: shopcart.settings.prod
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: ""
      DOCKER_MEDIA_SERVE: "True"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build:
      context: .
    container_name: shopcart_celery
    command: celery -A shopcart worker --loglevel=info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: shopcart.settings.prod
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: ""
      DOCKER_MEDIA_SERVE: "True"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: shopcart_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
