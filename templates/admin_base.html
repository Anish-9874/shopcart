{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}ShopCart Admin{% endblock %}</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #F8FAFC;
    color: #1E293B;
}

/* Layout */

.layout {
    display: flex;
    min-height: 100vh;
}

/* Sidebar */

.sidebar {
    width: 250px;
    background: #0F172A;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    z-index: 200;
}

.sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 24px;
    color: #fff;
    font-size: 19px;
    font-weight: 800;
    border-bottom: 1px solid rgba(255, 255, 255, .08);
    white-space: nowrap;
}

.sidebar-brand .dot { color: #2563EB; }

.sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 14px 12px;
}

.sidebar a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    margin-bottom: 4px;
    border-radius: 8px;
    color: #CBD5E1;
    text-decoration: none;
    transition: .2s ease;
    font-size: 14.5px;
    font-weight: 600;
}

.sidebar a:hover {
    background: rgba(255, 255, 255, .06);
    color: #fff;
}

.sidebar a.active {
    background: #2563EB;
    color: #fff;
    box-shadow: 0 6px 16px rgba(37, 99, 235, .35);
}

.sidebar-footer {
    padding: 14px 12px;
    border-top: 1px solid rgba(255, 255, 255, .08);
}

.sidebar-footer a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 8px;
    color: #FCA5A5;
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 600;
    transition: .2s ease;
}

.sidebar-footer a:hover {
    background: rgba(239, 68, 68, .12);
    color: #fff;
}

/* Mobile topbar (hidden on desktop) */

.mobile-topbar {
    display: none;
    align-items: center;
    gap: 14px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: #0F172A;
    color: #fff;
    padding: 0 18px;
    z-index: 150;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .12);
}

.sidebar-toggle {
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(255, 255, 255, .08);
    color: #fff;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
}

.mobile-topbar-brand {
    font-size: 16px;
    font-weight: 800;
}

.sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 190;
}

.sidebar-overlay.visible {
    opacity: 1;
    pointer-events: auto;
}

/* Main Content */

.content {
    margin-left: 250px;
    width: 100%;
    padding: 30px;
}

/* Page Header */

.page-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

.page-header h1 {
    font-size: 28px;
    color: #0F172A;
}

/* Tables */

.table-scroll {
    width: 100%;
    overflow-x: auto;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
}

.table {
    width: 100%;
    min-width: 560px;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
}

.table th {
    background: #F1F5F9;
    color: #64748B;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: .4px;
    padding: 15px;
    text-align: left;
    white-space: nowrap;
}

.table td {
    padding: 15px;
    border-bottom: 1px solid #E2E8F0;
}

.table tr:last-child td { border-bottom: none; }

.table tr:hover { background: #F8FAFC; }

/* Buttons */

.btn-primary,
.btn-success,
.btn-danger {
    display: inline-block;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13.5px;
    border: none;
    cursor: pointer;
    transition: .2s ease;
    color: #fff;
}

.btn-primary { background: #2563EB; }
.btn-primary:hover { background: #1D4ED8; }

.btn-success { background: #10B981; }
.btn-success:hover { background: #059669; }

.btn-danger { background: #EF4444; }
.btn-danger:hover { background: #DC2626; }

/* RESPONSIVE */
@media (max-width: 900px) {

    .mobile-topbar { display: flex; }

    .sidebar {
        transform: translateX(-100%);
        transition: transform .3s ease;
        box-shadow: 0 0 30px rgba(0, 0, 0, .25);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .content {
        margin-left: 0;
        padding: 20px;
        padding-top: 84px;
    }

    .page-header h1 { font-size: 22px; }
}

@media (max-width: 480px) {
    .content { padding: 16px; padding-top: 80px; }
    .btn-primary, .btn-success, .btn-danger { padding: 9px 14px; font-size: 13px; }
}

</style>

{% block extra_css %}
{% endblock %}

</head>

<body>

<!-- Mobile topbar -->
<div class="mobile-topbar">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="sidebar">☰</button>
    <span class="mobile-topbar-brand">🛍️ ShopCart Admin</span>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout">

    <!-- Sidebar -->

    <div class="sidebar" id="sidebar">

        <div class="sidebar-brand">
            <span>🛍️</span> ShopCart<span class="dot">.</span>Admin
        </div>
        

        <nav class="sidebar-nav">

            <a href="{% url 'admin_dashboard' %}" class="{% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">📊 Dashboard</a>

            <a href="{% url 'add_product' %}" class="{% if request.resolver_match.url_name == 'add_product' %}active{% endif %}">📦 Add Products</a>

            <a href="{% url 'see_product' %}" class="{% if request.resolver_match.url_name == 'see_product' %}active{% endif %}">🛒 Products</a>

            <a href="{% url 'customer_list' %}" class="{% if request.resolver_match.url_name == 'customer_list' %}active{% endif %}">👥 Customers</a>

            <a href="{% url 'inbox' %}" class="{% if request.resolver_match.url_name == 'inbox' %}active{% endif %}">💬 Chats</a>

            <a href="#">⭐ Reviews</a>

            <a href="#">📈 Reports</a>

        </nav>

        <div class="sidebar-footer">
            <a href="{% url 'logout' %}">🚪 Logout</a>
        </div>

    </div>

    <!-- Page Content -->

    <div class="content">

        {% block content %}
        {% endblock %}

    </div>

</div>

<script>
(function () {
    var toggle = document.getElementById('sidebarToggle');
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebarOverlay');

    function setOpen(open) {
        sidebar.classList.toggle('open', open);
        overlay.classList.toggle('visible', open);
        toggle.setAttribute('aria-expanded', open);
    }

    toggle.addEventListener('click', function () {
        setOpen(!sidebar.classList.contains('open'));
    });

    overlay.addEventListener('click', function () {
        setOpen(false);
    });

    sidebar.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
            setOpen(false);
        });
    });
})();
</script>

{% block extra_js %}
{% endblock %}

</body>
</html>
